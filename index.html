<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }

        .game-board {
            position: relative;
            background: #000;
            border: 3px solid #333;
            border-radius: 10px;
        }

        #gameCanvas {
            display: block;
            border-radius: 7px;
        }

        .game-info {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .info-panel h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .score {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .level, .lines {
            font-size: 1.5em;
            color: #764ba2;
            margin: 5px 0;
        }

        .next-piece {
            width: 100px;
            height: 80px;
            background: #000;
            border: 2px solid #333;
            border-radius: 5px;
            margin: 10px 0;
        }

        .controls {
            text-align: center;
        }

        .game-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .control-btn {
            padding: 15px;
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .start-btn {
            grid-column: 1 / -1;
            background: linear-gradient(145deg, #27ae60, #2ecc71);
            font-size: 1.5em;
            padding: 20px;
        }

        .pause-btn {
            grid-column: 1 / -1;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #e74c3c;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 15px;
            }

            .game-board {
                order: 2;
            }

            .game-info {
                order: 1;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }

            .info-panel {
                flex: 1;
                min-width: calc(50% - 10px);
                margin-bottom: 10px;
            }

            .controls {
                width: 100%;
                order: 3;
            }

            .game-controls {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
                margin: 15px 0;
            }

            .control-btn {
                padding: 20px 10px;
                font-size: 1em;
            }

            .start-btn {
                grid-column: 1 / -1;
            }

            .pause-btn {
                grid-column: 1 / -1;
            }

            #gameCanvas {
                max-width: 100%;
                height: auto;
            }

            .score {
                font-size: 1.5em;
            }

            .level, .lines {
                font-size: 1.2em;
            }
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 10px;
            }

            .info-panel {
                padding: 10px;
            }

            .info-panel h3 {
                font-size: 1em;
            }

            .score {
                font-size: 1.3em;
            }

            .level, .lines {
                font-size: 1em;
            }

            .control-btn {
                padding: 15px 8px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-board">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div class="game-over" id="gameOver">
                <h2>Game Over!</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <button class="control-btn start-btn" onclick="startGame()">Play Again</button>
            </div>
        </div>

        <div class="game-info">
            <div class="info-panel">
                <h3>Score</h3>
                <div class="score" id="score">0</div>
            </div>

            <div class="info-panel">
                <h3>Level</h3>
                <div class="level" id="level">1</div>
                <h3>Lines</h3>
                <div class="lines" id="lines">0</div>
            </div>

            <div class="info-panel">
                <h3>Next Piece</h3>
                <canvas class="next-piece" id="nextCanvas" width="100" height="80"></canvas>
            </div>
        </div>

        <div class="controls">
            <div class="game-controls">
                <button class="control-btn start-btn" id="startBtn" onclick="startGame()">Start Game</button>
                <button class="control-btn pause-btn" id="pauseBtn" onclick="pauseGame()" style="display:none;">Pause</button>
                <button class="control-btn" onclick="moveLeft()">←</button>
                <button class="control-btn" onclick="rotatePiece()">↻</button>
                <button class="control-btn" onclick="moveRight()">→</button>
                <button class="control-btn" onclick="moveDown()">↓</button>
            </div>
            <div class="info-panel">
                <h3>Controls Keyboard</h3>
                <p>← → : Move Left/Right</p>
                <p>↓ : Down Faster</p>
                <p>↑ : Rotation</p>
                <p>Space : Pause</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let level = 1;
        let lines = 0;
        let dropTime = 0;
        let lastTime = 0;

        // Tetris pieces
        const PIECES = [
            {
                shape: [
                    [1, 1, 1, 1]
                ],
                color: '#00f0f0'
            },
            {
                shape: [
                    [1, 1],
                    [1, 1]
                ],
                color: '#f0f000'
            },
            {
                shape: [
                    [0, 1, 0],
                    [1, 1, 1]
                ],
                color: '#a000f0'
            },
            {
                shape: [
                    [1, 0, 0],
                    [1, 1, 1]
                ],
                color: '#f0a000'
            },
            {
                shape: [
                    [0, 0, 1],
                    [1, 1, 1]
                ],
                color: '#0000f0'
            },
            {
                shape: [
                    [0, 1, 1],
                    [1, 1, 0]
                ],
                color: '#00f000'
            },
            {
                shape: [
                    [1, 1, 0],
                    [0, 1, 1]
                ],
                color: '#f00000'
            }
        ];

        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        }

        function drawBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        drawBlock(ctx, col, row, board[row][col]);
                    }
                }
            }
        }

        function drawPiece(piece, offsetX = 0, offsetY = 0, context = ctx) {
            const blockSize = context === nextCtx ? 20 : BLOCK_SIZE;
            
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        context.fillStyle = piece.color;
                        context.fillRect(
                            (piece.x + x + offsetX) * blockSize,
                            (piece.y + y + offsetY) * blockSize,
                            blockSize,
                            blockSize
                        );
                        context.strokeStyle = '#333';
                        context.lineWidth = 1;
                        context.strokeRect(
                            (piece.x + x + offsetX) * blockSize,
                            (piece.y + y + offsetY) * blockSize,
                            blockSize,
                            blockSize
                        );
                    }
                });
            });
        }

        function createPiece() {
            const pieceType = PIECES[Math.floor(Math.random() * PIECES.length)];
            return {
                shape: pieceType.shape.map(row => [...row]),
                color: pieceType.color,
                x: Math.floor(COLS / 2) - Math.floor(pieceType.shape[0].length / 2),
                y: 0
            };
        }

        function isValidMove(piece, dx, dy, newShape = null) {
            const shape = newShape || piece.shape;
            
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const newX = piece.x + x + dx;
                        const newY = piece.y + y + dy;
                        
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return false;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placePiece(piece) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        board[piece.y + y][piece.x + x] = piece.color;
                    }
                });
            });
        }

        function clearLines() {
            let linesCleared = 0;
            
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++;
                }
            }
            
            if (linesCleared > 0) {
                lines += linesCleared;
                score += linesCleared * 100 * level;
                level = Math.floor(lines / 10) + 1;
                
                updateUI();
            }
        }

        function rotatePiece() {
            if (!currentPiece || !gameRunning || gamePaused) return;
            
            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );
            
            if (isValidMove(currentPiece, 0, 0, rotated)) {
                currentPiece.shape = rotated;
            }
        }

        function moveLeft() {
            if (!currentPiece || !gameRunning || gamePaused) return;
            
            if (isValidMove(currentPiece, -1, 0)) {
                currentPiece.x--;
            }
        }

        function moveRight() {
            if (!currentPiece || !gameRunning || gamePaused) return;
            
            if (isValidMove(currentPiece, 1, 0)) {
                currentPiece.x++;
            }
        }

        function moveDown() {
            if (!currentPiece || !gameRunning || gamePaused) return;
            
            if (isValidMove(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 1;
                updateUI();
            } else {
                placePiece(currentPiece);
                clearLines();
                currentPiece = nextPiece;
                nextPiece = createPiece();
                
                if (!isValidMove(currentPiece, 0, 0)) {
                    gameOver();
                }
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (nextPiece) {
                const tempPiece = {
                    ...nextPiece,
                    x: 1,
                    y: 1
                };
                drawPiece(tempPiece, 0, 0, nextCtx);
            }
        }

        function gameLoop(time = 0) {
            if (!gameRunning || gamePaused) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropTime += deltaTime;
            
            if (dropTime > 1000 - (level - 1) * 100) {
                moveDown();
                dropTime = 0;
            }
            
            drawBoard();
            if (currentPiece) {
                drawPiece(currentPiece);
            }
            drawNextPiece();
            
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameRunning = true;
            gamePaused = false;
            score = 0;
            level = 1;
            lines = 0;
            dropTime = 0;
            lastTime = 0;
            
            initBoard();
            currentPiece = createPiece();
            nextPiece = createPiece();
            
            updateUI();
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'block';
            document.getElementById('gameOver').style.display = 'none';
            
            requestAnimationFrame(gameLoop);
        }

        function pauseGame() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? 'Resume' : 'Pause';
            
            if (!gamePaused) {
                requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('pauseBtn').style.display = 'none';
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gamePaused) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    moveLeft();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveRight();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveDown();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    pauseGame();
                    break;
            }
        });

        // Initialize
        initBoard();
        drawBoard();
        updateUI();
    </script>
</body>
</html>
